<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f5e2b8"/>
      <stop offset="70%" stop-color="#dfc08a"/>
      <stop offset="100%" stop-color="#b88d4d"/>
    </linearGradient>
    <radialGradient id="aaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b88d4d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1713" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Obsidian Green Background -->
  <rect width="100" height="100" rx="22" fill="#0b1713"/>
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#aaGold)" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="50" cy="50" r="42" fill="url(#aaGlow)"/>
  <!-- Architectural Drafting Compass & Triangular Structure -->
  <path d="M24 76 L50 18 L76 76" fill="none" stroke="url(#aaGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="58" x2="68" y2="58" stroke="url(#aaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Compass Pivot Head -->
  <circle cx="50" cy="18" r="3.5" fill="#f5e2b8"/>
  <!-- Brand Monogram -->
  <text x="50" y="71" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="url(#aaGold)" text-anchor="middle" letter-spacing="1">A&amp;A</text>
  <circle cx="50" cy="80" r="1.5" fill="#dfc08a"/>
</svg>
